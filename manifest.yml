# Slack app manifest. Create the app from it at https://api.slack.com/apps?new_app=1 ("From a manifest").
display_information:
  name: ai-commentator
  description: Replies in the thread of Slack posts with what AI writes for a fixed prompt.
features:
  bot_user:
    display_name: ai-commentator
    always_online: true
  slash_commands:
    - command: /ai-commentator
      description: Show and edit the rules of this channel
      usage_hint: "[list | add | help]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - commands
      - emoji:read
      - groups:history
      - groups:read
      - reactions:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - member_joined_channel
      - message.channels
      - message.groups
      - reaction_added
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
